<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Демонстрационный экран накопительного счёта">
    <title>Накопительный ВТБ-Счёт — демо</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a class="back-link" href="index.html">← <span>Назад</span></a>
    <a class="logo" href="index.html">ВТБ</a>
    <span class="header-title">ВТБ Онлайн</span>
</header>

<main class="container">
    <aside class="sidebar">
        <div class="user">Всеволод<br>Алексеевич</div>
        <nav>
            <a class="menu-item" href="index.html">Главная</a>
            <a class="menu-item" href="#">Платежи</a>
            <a class="menu-item" href="#">История</a>
            <a class="menu-item" href="#">Справки</a>
            <a class="menu-item" href="#">⚙ Сервисы</a>
        </nav>
    </aside>

    <section class="main-content">
        <div class="card account-card">
            <div class="account-label">Накопительный ВТБ-Счёт</div>
            <h1>50 211,17 ₽</h1>
            <div class="account-number">Счёт № 22003054572863</div>
            <p class="muted">на ежедневный остаток</p>
            <div class="button-row">
                <button>Пополнить</button>
                <button class="secondary">Перевести</button>
            </div>
        </div>

        <div class="card rate-card">
            <div class="rate-row">
                <div>
                    <span class="eyebrow">Доходность</span>
                    <h2>7,5% годовых</h2>
                </div>
                <div class="rate-badge">7,5%</div>
            </div>
            <p>Потратьте ещё 1 936 ₽ до 9%</p>
            <div class="progress"><span></span></div>
        </div>

        <div class="mobile-support support">
            <h3>Поддержка 24/7</h3>
            <button class="secondary">Задать вопрос</button>
        </div>
    </section>

    <aside class="support desktop-support">
        <div class="support-icon">?</div>
        <h3>Поддержка 24/7</h3>
        <p>Помощник ВТБ<br>ответит на вопросы</p>
        <button class="secondary">Задать вопрос</button>
    </aside>
</main>

</body>
</html>
